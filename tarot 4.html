<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>


    <style type="text/css" media="screen">
        
        table, th, td {
             border: 1px solid;
        }
       
        .conteneurscores {
            width:100%;
            overflow-y: scroll;
        }

        .tablescores
        {
            font-size: larger;

            tr:nth-child(odd) td {
                background-color: #49ee70;
                text-align: center;
            }

            tr:nth-child(even) td {
                background-color: #ffffe9;
                text-align: center;
            }

            td:nth-child(1)
            {
                position: sticky;
                left: 0; 
                z-index: 5;
                text-align: center; 
            }
        }
        .tablehistoriquescores
        {
            font-size: larger;

            tr:nth-child(even) td {
                background-color: #49ee70;
                text-align: center;
            }

            tr:nth-child(odd) td {
                background-color: #ffffe9;
                text-align: center;
            }

            tr:nth-child(1) td, tr:nth-child(2) td, tr:nth-child(3) td {
                background-color: #f1b07a;
                text-align: center;
            }


            td:nth-child(1)
            {
                position: sticky;
                background-color: #ffffe9;
                left: 0; 
                z-index: 5; 
                text-align: center;
            }
            
        }
 

    </style>

        
    <div id="blocjeu" style="visibility: collapse;">
        
        <div class="conteneurscores"> 
               
            <table class="tablescores">
                
                <tbody id="score">
                    <label for="score">dernière partie</label>
        
                </tbody>
    
            </table>

            
            <table class="tablehistoriquescores">
                
                <tbody id="historiquescore">
                    <label for="historiquescore">historique des parties</label>
        
                </tbody>
    
            </table>

        </div>

        
        <div id='controles'>
            <div id="mort"
                <label for="mort">premier non-joueur&nbsp;:</label>
                <select id="nonjoueur">
                </select>
            </div>
            <label for="preneur">preneur&nbsp;:</label>
            <select id="preneur">
            </select>
            <label for="enchere">enchère&nbsp;:</label>
            <select id="enchere">        
            </select>
            
            <div id="blocpartenaire">
                <label for="partenaire">partenaire&nbsp;:</label>
                <select id="partenaire">  
                </select>
            </div>
            
            <div>
            <label for="bouts">nombre de bouts du preneur&nbsp;:</label>     
            <select id="bouts">
            </select>
            </div>
            <div id='nbrepointspreneur'>
                <label for="pointspreneur">nombre de points du preneur&nbsp;:</label>     
                <input type = "number" id="pointspreneur">
            </div>
            <div id='nbrepointsadverse'>
                <label for="pointsadverse">nombre de points des adversaires&nbsp;:</label>     
                <input type = "number" id="pointsadverse">
            </div>
            <div>
            <label for="bouton">petit au bout</label><br />
            <select id="bout"></select>
            <select id="quibout"></select>
            </div>
            <div>
            <label for="poignee">poignée</label><br />
            <select id="poignee"></select>
            <select id="reussitepoignee"></select>
            </div>
            <div>
            <label for="chelem">grand chelem</label><br />
            <select id="grandchelem"></select>
            </div>
            <br />
            <button id="mettreajour">Mettre à jour nouvelle partie</button>
            <br />
            <br />
            <div>
            <label for="autreaction">autres actions&nbsp;:</label>
            <br />
            <button id="scoreszero">Mettre les scores à zéro</button>
            <div id = "message">
                <label for="somme" >la somme des points doit être égale à 0</label>
            </div>
            <button id="nouveauxnoms">Changer les noms</button>
            </select>
            </div>

        </div>

    </div>


    <script src='tarot 4-5-6.js'></script>
    <script>
    
        document.getElementById('mettreajour').addEventListener(
            'click',
            () => {
               acterDernierePartie();
            }
        );

        
        document.getElementById('scoreszero').addEventListener(
            'click',
            () => {
               remiseAzero(nombreJoueurs);
            }
        );
        document.getElementById('nouveauxnoms').addEventListener(
            'click',
            () => {
               nouveauPlateau(nombreJoueurs);
            }
        );

        // initialisation
        creer(4);
    </script>
</body>

</html>
