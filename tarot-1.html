<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>


    <style type="text/css" media="screen">
        table, th, td {
             border: 1px solid;
        }
       
        
    </style>

    <div id="bloccreation">
        <button id="quatre">quatre joueurs</button>
        <button id="cinq">cinq joueurs</button>
    </div>
    
    <div id="blocjeu" style="visibility: collapse;">

    
        <table>
             
            <tbody id="score">

    
    
            </tbody>
 
        </table>
    

        <br />
        <br />

        
        <div id='controles'>
            <label for="preneur">preneur&nbsp;:</label>
            <select id="preneur">
            </select>
            <div id="blocpartenaire">
                <label for="partenaire">partenaire&nbsp;:</label>
                <select id="partenaire">  
                </select>
            </div>
            <label for="enchere">enchère&nbsp;:</label>
            <select id="enchere">        
            </select>
            <div>
            <label for="bouts">nombre de bouts du preneur&nbsp;:</label>     
            <select id="bouts">
            </select>
            </div>
            <div id='nbrepointspreneur'>
                <label for="pointspreneur">nombre de points du preneur&nbsp;:</label>     
                <input id="pointspreneur">
            </div>
            <div id='nbrepointsadverse'>
                <label for="pointsadverse">nombre de points des adversaires&nbsp;:</label>     
                <input id="pointsadverse">
            </div>
            <button id="mettreajour">Mettre à jour nouvelle partie</button>
            

            <br />
            <br />

            <label for="autre">compléments&nbsp;:</label>
            <select id="autre">        
            </select>
            <label for="beneficiaire">joueur bénéficiaire&nbsp;:</label>
            <select id="beneficiaire">        
            </select>
            <button id="mettreajourcomplement">Mettre à jour complément</button>

        </div>

    </div>


    <script src='tarot-1.js'></script>
    <script>
    

        document.getElementById('quatre').addEventListener(
            'click',
            () => {
               creer(4);
            }
        );

        document.getElementById('cinq').addEventListener(
            'click',
            () => {
               creer(5);
            }
        );
    

        document.getElementById('mettreajour').addEventListener(
            'click',
            () => {
               actualiserScoresClick();
            }
        );

        document.getElementById('mettreajourcomplement').addEventListener(
            'click',
            () => {
               mettreAJourComplementClick();
            }
        );
    </script>
</body>

</html>
