<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>


    <style type="text/css" media="screen">
        
        table, th, td {
             border: 1px solid;
        }
       
        .conteneurscores {
            width:100%;
            overflow-y: scroll;
        }

        .tablescores
        {
            font-size: larger;

            tr:nth-child(odd) td {
                background-color: #10f542;
                text-align: center;
            }

            

            td:nth-child(1)
            {
                position: sticky;
                left: 0; 
                z-index: 5;
                text-align: center; 
            }
        }
        .tablehistoriquescores
        {
            font-size: larger;

            tr:nth-child(even) td {
                background-color: #49ee70;
                text-align: center;
            }

           

            tr:nth-child(odd) td {
                background-color: #ffffe9;
                text-align: center;
            }

            td:nth-child(1)
            {
                position: sticky;
                background-color: #ffffe9;
                left: 0; 
                z-index: 5; 
                text-align: center;
            }
            
        }
 

    </style>

        
    <div id="blocjeu" style="visibility: collapse;">
        
        <div class="conteneurscores"> 
               
            
            
            <table class="tablehistoriquescores">

                    <br />
                    <br />
        
                </tbody>
    
            </table>
            <br />
            <br />

        </div>

            <br />

            <div id='nbrepointsEUX'>

            <button id="mettreajour">Mettre à jour nouvelle partie</button>

            <br />
